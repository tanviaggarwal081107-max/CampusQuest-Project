<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusQuest | Login</title>

    <link rel="stylesheet" href="../CSS/login.css">

</head>


<body>


    <!-- =========================
         GAMING BACKGROUND
    ========================== -->

    <div class="background">

        <div class="stars"></div>

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="energy energy-one"></div>

        <div class="energy energy-two"></div>


        <!-- Floating Gaming Icons -->

        <div class="floating-game game-one">⚡</div>

        <div class="floating-game game-two">🎮</div>

        <div class="floating-game game-three">🏆</div>

        <div class="floating-game game-four">⭐</div>

        <div class="floating-game game-five">👾</div>

        <div class="floating-game game-six">🚀</div>


        <!-- Shooting Lights -->

        <div class="shooting-star star-one"></div>

        <div class="shooting-star star-two"></div>

    </div>



    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <div class="login-container">


        <!-- Logo -->

        <div class="logo">

            <span>⚡</span>

            <h1>CampusQuest</h1>

        </div>


        <p class="tagline">
            YOUR CAMPUS. YOUR QUEST.
        </p>



        <!-- =========================
             LOGIN BOX
        ========================== -->

        <div class="login-box">


            <h2>
                Welcome Back, Questor 🎮
            </h2>


            <p class="login-text">
                Enter your details to continue your quest.
            </p>



            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        autocomplete="email"
                    >


                    <small id="emailError"></small>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-box">


                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-button"
                        >
                            👁
                        </button>


                    </div>


                    <small id="passwordError"></small>

                </div>



                <!-- REMEMBER + FORGOT -->

                <div class="options">


                    <label class="remember">


                        <input
                            type="checkbox"
                            id="remember"
                        >


                        <span>
                            Remember me
                        </span>


                    </label>



                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-button"
                    >
                        Forgot Password?
                    </button>


                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    ENTER THE QUEST ⚡
                </button>



                <!-- LOGIN MESSAGE -->

                <p id="loginMessage"></p>


            </form>



            <!-- REGISTER -->

            <div class="register">

                <p>

                    New to CampusQuest?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>


        </div>


    </div>



    <!-- =========================
         FORGOT PASSWORD MODAL
    ========================== -->

    <div
        id="forgotModal"
        class="modal"
    >


        <div class="forgot-box">


            <button
                type="button"
                id="closeModal"
                class="close-button"
            >
                ×
            </button>



            <div class="forgot-icon">
                🔐
            </div>



            <h2>
                Forgot Your Password?
            </h2>



            <p>
                Enter your registered email and we'll help you reset
                your password.
            </p>



            <form id="forgotForm">


                <div class="input-group">


                    <label for="forgotEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                    >


                    <small id="forgotEmailError"></small>


                </div>



                <button
                    type="submit"
                    class="reset-button"
                >
                    SEND RESET LINK 📩
                </button>



                <p id="forgotMessage"></p>


            </form>


        </div>


    </div>



    <!-- JAVASCRIPT -->

    <script src="../JS/login.js"></script>


</body>

</html>
